services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fundstueck
      POSTGRES_USER: fundstueck
      # Required: set POSTGRES_PASSWORD in .env (never hardcode credentials).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - fundstueck_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fundstueck -d fundstueck']
      interval: 5s
      timeout: 5s
      retries: 10

  fundstueck:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      DATA_DIR: /app/data
      XDG_CACHE_HOME: /app/data/.cache
      DATABASE_URL: postgres://fundstueck:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/fundstueck
      # Operator/admin API access (REQUIRED before exposing a BETA):
      # routes like custom sources, catalog installs and setup mutations
      # require a bearer OPERATOR_TOKEN or a session of an ADMIN_EMAILS user.
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set OPERATOR_TOKEN in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Optional first-run region; leave empty to use onboarding.
      # REGION: CH
      ENABLE_PLUGINS: 'false'
    ports:
      - '3002:3002'
    volumes:
      - fundstueck_data:/app/data
      - fundstueck_plugins:/app/plugins
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  fundstueck_pg:
  fundstueck_data:
  fundstueck_plugins:
